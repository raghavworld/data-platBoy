services:
  superset-init:
    build:
      context: ../docker/superset
    container_name: local-data-platform-modular-superset-init
    environment: &superset-env
      TZ: ${TZ}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@airflow-postgres:5432/${SUPERSET_DB_NAME}
      SUPERSET_USER: ${SUPERSET_USER}
      SUPERSET_PASSWORD: ${SUPERSET_PASSWORD}
      SUPERSET_TRINO_USER: ${SUPERSET_TRINO_USER}
      SUPERSET_TRINO_SQLALCHEMY_URI: ${SUPERSET_TRINO_SQLALCHEMY_URI}
    volumes:
      - ../superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ../superset/assets:/app/superset/static/assets/onov8:ro
      - ../data/bi/superset_home:/app/superset_home
    command: ["/usr/local/bin/init_superset.sh"]
    networks:
      - onov8-data-platform-net

  superset:
    build:
      context: ../docker/superset
    container_name: local-data-platform-modular-superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
    environment: *superset-env
    volumes:
      - ../superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ../superset/assets:/app/superset/static/assets/onov8:ro
      - ../data/bi/superset_home:/app/superset_home
    command: /bin/sh -c "gunicorn -w 1 --timeout 120 -b 0.0.0.0:8088 'superset.app:create_app()'"
    ports:
      - "${SUPERSET_PORT}:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - onov8-data-platform-net
    restart: unless-stopped

networks:
  onov8-data-platform-net:
    external: true
    name: onov8-data-platform-net
