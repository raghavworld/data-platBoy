services:
  minio:
    image: minio/minio:latest
    container_name: local-data-platform-modular-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ../data/storage/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - onov8-data-platform-net
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: local-data-platform-modular-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET_RAW} || true &&
      mc mb -p local/${MINIO_BUCKET_DELTA} || true &&
      mc mb -p local/${MINIO_BUCKET_AUDIT} || true
      "
    networks:
      - onov8-data-platform-net

networks:
  onov8-data-platform-net:
    external: true
    name: onov8-data-platform-net
