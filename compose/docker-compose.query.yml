services:
  trino:
    image: trinodb/trino:480
    container_name: local-data-platform-modular-trino
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ../trino/etc:/etc/trino
      - ../trino/catalog:/etc/trino/catalog
      - ../trino/access-control:/etc/trino/access-control
    ports:
      - "${TRINO_BIND_HOST:-127.0.0.1}:${TRINO_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info | grep -q nodeVersion"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - onov8-data-platform-net
    restart: unless-stopped

networks:
  onov8-data-platform-net:
    external: true
    name: onov8-data-platform-net
