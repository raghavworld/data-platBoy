services:
  spark:
    image: apache/spark:3.5.5
    platform: linux/amd64
    container_name: local-data-platform-modular-spark
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_PORT: ${SPARK_MASTER_PORT}
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_CORES: 2
    command: ["/bin/bash", "/opt/platform/docker/spark/entrypoint.sh"]
    volumes:
      - ../:/opt/platform
      - ../data/compute/logs:/opt/platform/data/logs
      - ../data/compute/spark-warehouse:/tmp/spark-warehouse
    ports:
      - "${SPARK_MASTER_PORT}:7077"
      - "${SPARK_UI_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - onov8-data-platform-net
    restart: unless-stopped

networks:
  onov8-data-platform-net:
    external: true
    name: onov8-data-platform-net
